# ========================================
# 开发环境配置
# ========================================
# 此文件仅包含开发环境特定的差异化配置
# 基础配置通过模块化导入，详见 application.yml

# 服务器配置（开发环境）
server:
  port: 8080

# Swagger API 文档配置（仅开发环境）
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
  packages-to-scan: org.unreal.modelrouter.controller
  show-actuator: true
  cache:
    disabled: true

# H2 控制台（仅开发环境）
spring:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # ===== 本地切换 PostgreSQL（默认关闭，仍走 H2 ./data/trunkline）=====
  # 方式一（推荐，不改文件）：启动前设置环境变量即可一键切库。
  #   config/config-service/core.yml 的 ${DATABASE_URL:...} 会被环境变量覆盖，
  #   FlywayDialectEnvironmentPostProcessor 自动切到 db/migration/postgres，
  #   并把 ddl-auto 覆盖为 validate（建表交给 Flyway）。
  #   需先建库：CREATE DATABASE trunkline;
  #     DATABASE_URL=jdbc:postgresql://localhost:5432/trunkline
  #     DATABASE_USERNAME=trunkline
  #     DATABASE_PASSWORD=<password>
  # 方式二（改文件）：取消下面 datasource 注释。注意 profile 配置优先级高于
  #   classpath import，取消后 core.yml 的 ${DATABASE_URL:...}（含环境变量）不再生效。
  # datasource:
  #   url: jdbc:postgresql://localhost:5432/trunkline
  #   username: trunkline
  #   password: trunkline
  #   driver-class-name: org.postgresql.Driver

# 日志配置（开发环境详细日志）
logging:
  level:
    org.unreal.modelrouter: DEBUG
    org.springframework: INFO

# 管理端点（开发环境全部开放）
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      show-components: always
    jwt-tokens:
      enabled: true
    jwt-blacklist:
      enabled: true
    jwt-persistence-health:
      enabled: true

# 安全配置（开发环境启用测试功能）
trunkline:
  call-history:
    record-level: SUMMARY   # 脱敏摘要（默认截断200字）；要完整诗文用 FULL（AES-256-GCM 加密存储）
  enterprise:
    pricing:
      # 高级计价（普通/阶梯/时段 + 缓存分项）：默认关闭；开启后叠加 billing 功能位，
      # /v1/enterprise/features 才返回 pricingAdvanced=true，模型配置页单价旁才显示
      # 「高级计价规则」入口（EnterpriseFeaturesProviderImpl.pricingAdvanced）。
      advanced-enabled: true
  security:
    enabled: true
    
    jwt:
      enabled: true
      # 与 config/auth/jwt.yml 同一口径：不内置任何可用的默认密钥。
      # 别名顺序 JWT_SECRET > PROD_JWT_SECRET > DEV_JWT_SECRET（issue #674，与启动门闩同口径）。
      # 三者皆未设置时由启动期处理器生成并持久化随机密钥。
      secret: "${JWT_SECRET:${PROD_JWT_SECRET:${DEV_JWT_SECRET:}}}"

      # 开发环境同样不提供默认管理员；首次启动访问 /init 完成初始化。
      accounts: []

    api-key:
      enabled: true
      
    audit:
      log-level: "DEBUG"
      include-request-body: true
      include-response-body: true
    
    sanitization:
      response:
        enabled: false

# 历史 webclient.* 覆盖块已移除（无消费者，见 config/common/webclient.yml 说明）。
# 开发环境如需调整出站超时，用 TRUNKLINE_WEBCLIENT_* 或 trunkline.webclient.*（实际生效项）。

# 调试模式
debug: false